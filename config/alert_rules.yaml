alerts:
  - name: High_Latency_P95
    severity: high
    condition: p95_latency > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: on-call
    runbook: docs/alerts.md#alert-1
  - name: High_Error_Rate
    severity: critical
    condition: error_rate > 2%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: on-call
    runbook: docs/alerts.md#alert-2
  - name: Quality_Score_Drop
    severity: warning
    condition: quality_score_avg < 0.75
    duration: 10m
    type: symptom-based
    channel: slack
    owner: product-team
    runbook: docs/alerts.md#alert-3
